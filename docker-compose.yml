# The whole stack with one command: `docker compose up --build`
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: portfolio
      MYSQL_USER: portfolio
      MYSQL_PASSWORD: portfolio
      # Root is only used by the API tests, which create a throwaway database per test file.
      MYSQL_ROOT_PASSWORD: portfolio
    # Host port 3307 so it doesn't clash with another MySQL already on 3306.
    ports: ["3307:3306"]
    volumes: [mysqldata:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pportfolio --silent"]
      interval: 3s
      retries: 20

  api:
    # Context is the repo root because the npm workspace lockfile lives there.
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: mysql://portfolio:portfolio@db:3306/portfolio
    ports: ["4000:4000"]
    depends_on:
      db: { condition: service_healthy }
    # Checked often so `web` can start as soon as the API is ready.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the browser bundle: the browser runs on the host, so it uses localhost.
        NEXT_PUBLIC_API_URL: http://localhost:4000
    environment:
      # Read at runtime by Server Components: inside Docker the API is reachable by its service name.
      API_URL_INTERNAL: http://api:4000
    # Host port is configurable in case 3000 is taken (remember to add that origin to CORS_ORIGINS).
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  mysqldata:
