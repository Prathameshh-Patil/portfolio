# Checks every push and pull request. It deploys nothing (Vercel deploys on push to main); it only proves the code works.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The API tests create a throwaway database per test file on this server.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: portfolio
        ports: ["3307:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pportfolio --silent"
          --health-interval 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Runs against the MySQL service above (same address as the compose db on a laptop).
      - name: API tests
        run: npm test

      - name: Lambda bundle builds
        run: npm run build:lambda -w apps/api

      - name: Web build
        run: npm run build -w apps/web

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      # Starts the built site against a mock API (see apps/web/e2e/mock-api.mjs).
      - name: Playwright smoke tests
        run: npm run test:e2e -w apps/web

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

      # compose reads .env for the api service; the example values are enough to build the images.
      - name: Docker images build
        run: |
          cp .env.example .env
          docker compose build
